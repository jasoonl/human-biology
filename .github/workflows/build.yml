# Phase 100: written but NOT executed/verified in this environment - there is no
# game-ci license/UNITY_LICENSE secret configured on this repo. Trigger is
# workflow_dispatch (manual) rather than push, so this stops reporting a red X
# on every commit until a UNITY_LICENSE secret (and optionally
# UNITY_EMAIL/UNITY_PASSWORD for personal licenses) is added - then switch the
# trigger back to `push: branches: [main]`.
name: Build and Test

on:
  workflow_dispatch:

jobs:
  test:
    name: Run Unity Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          testMode: all

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts

  build:
    name: Build ${{ matrix.targetPlatform }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - WebGL
          - StandaloneWindows64
          - Android
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}

      - uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}

  release:
    name: Zip and Upload Release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Zip build artifacts
        run: |
          cd builds
          for dir in */; do
            zip -r "${dir%/}.zip" "$dir"
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: builds/*.zip
          tag_name: build-${{ github.run_number }}
